[package]
name = "bibleql-reader"
version = "0.4.0"
description = "Desktop Bible reader on the BibleQL GraphQL API"
authors = ["Luis Porras <lporras16@gmail.com>"]
license = "MIT"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bibleql_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api: turns on WKWebView's (private) fullScreenEnabled
# preference via wry's `fullscreen` feature — without it, element fullscreen is
# off in WKWebView, and YouTube embeds in a study show a dead fullscreen
# button. Must match `app.macOSPrivateApi` in tauri.conf.json. Fine for
# Developer ID distribution; it would block a Mac App Store submission.
tauri = { version = "2", features = ["macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
# Pinned to ~2.6 to match @tauri-apps/plugin-http on npm, whose latest
# stable is 2.6.1. Tauri refuses to start when the crate and the JS
# package differ in major/minor. Bump both together.
tauri-plugin-http = "~2.6"
tauri-plugin-os = "2"
# Local: shows an exported study PDF in Quick Look on iOS (plugins/).
tauri-plugin-quicklook = { path = "plugins/tauri-plugin-quicklook" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Offline translation packages (src/offline.rs): `bundled` compiles SQLite in
# with FTS5, so search works the same on every OS and on Android's NDK.
rusqlite = { version = "0.40", features = ["bundled"] }
sha2 = "0.10"
flate2 = "1"
unicode-normalization = "0.1"
# Per-installation BibleQL token (src/install.rs): keyring-core plus the OS
# credential store for each target, linked directly rather than through the
# `keyring` umbrella crate, whose v1 mode has no iOS or Android store.
keyring-core = "1"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }

[target.'cfg(target_os = "ios")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["protected"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-native-keyring-store = "1"

# zbus, not libdbus: pure Rust, so the Linux build needs no extra apt package.
[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "1", features = ["crypto-rust"] }

[target.'cfg(target_os = "android")'.dependencies]
android-native-keyring-store = "1"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
