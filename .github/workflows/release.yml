name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # Two macOS builds: Apple silicon and Intel. Unlike Electron,
          # which shipped one binary per OS, a Tauri bundle is a native
          # Rust build and is architecture-specific.
          - os: macos-latest
            platform: macos-arm64
            args: "--target aarch64-apple-darwin"
          - os: macos-latest
            platform: macos-x64
            args: "--target x86_64-apple-darwin"
          - os: windows-latest
            platform: windows
            args: ""
          - os: ubuntu-22.04
            platform: linux
            args: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Tauri system dependencies (Linux)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      # tauri-action runs `tauri build`, which runs `beforeBuildCommand`
      # (yarn build -> typecheck + unit tests + vite build), then bundles
      # and uploads the installers to a draft GitHub release.
      #
      # Both keys must be present here, not just at bundle time: they're
      # inlined into the frontend by vite.config.ts's `define`.
      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIBLEQL_API_KEY: ${{ secrets.BIBLEQL_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BibleQL Reader ${{ github.ref_name }}"
          releaseDraft: true
          generateReleaseNotes: true
          args: ${{ matrix.args }}
