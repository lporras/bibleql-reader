name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: Typecheck, unit tests, E2E
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Typecheck
        run: yarn typecheck

      - name: Unit tests (Vitest)
        run: yarn test

      - name: Install Playwright's Chromium
        run: yarn playwright install --with-deps chromium

      # Browser E2E against a production build that playwright.config.ts
      # builds and serves itself. No Xvfb: unlike Electron, which always
      # opened a real native window, headless Chromium needs no display.
      # No secrets: BibleQL and Unsplash are both mocked, and the build gets
      # placeholder keys (see playwright.config.ts), so fork PRs run the full
      # suite too.
      - name: E2E tests (Playwright)
        run: yarn test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  rust:
    name: Check the Tauri shell
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tauri's Linux build needs the system webview and its dependencies
      # even just to type-check the crate.
      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf libssl-dev

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: cargo check
        run: cargo check --manifest-path src-tauri/Cargo.toml
